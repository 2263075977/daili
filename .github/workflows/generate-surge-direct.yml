name: Generate Surge rule sets

on:
  push:
    branches: [main]
    paths:
      - "mihomo/direct.yaml"
      - "mihomo/proxy.yaml"
      - "mihomo/reject.yaml"
      - "adguard/reject.txt"
      - "scripts/convert_clash_direct_to_surge.py"
      - ".github/workflows/generate-surge-direct.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-surge-${{ github.ref }}
  cancel-in-progress: true

env:
  GEN: scripts/convert_clash_direct_to_surge.py
  FILES: >-
    mihomo/direct.txt
    mihomo/proxy.txt
    mihomo/reject.txt
    adguard/reject.txt

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      # 只告警不失败：产物落后/被手改时下面会按 yaml 重新生成并提交
      - name: Detect drift against yaml
        run: |
          if ! python3 "$GEN" --check; then
            echo "::warning title=规则集产物与 yaml 不一致::已按 yaml 重新生成并提交，手改的内容可能被覆盖"
          fi

      - name: Generate rule sets
        run: python3 "$GEN"

      - name: Verify rule sets
        run: |
          python3 "$GEN" --check          # 生成后必须与期望完全一致（幂等）
          wc -l mihomo/direct.txt mihomo/proxy.txt mihomo/reject.txt adguard/reject.txt
          for f in $FILES; do
            test -s "$f" || { echo "::error::$f 为空"; exit 1; }
          done

      - name: Commit generated rule sets
        run: |
          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "No changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add $FILES
          git commit -m "chore: generate rule sets (surge direct/proxy/reject + adguard reject)"
          git push
