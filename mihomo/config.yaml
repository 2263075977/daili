rule-anchor:
  mrs-domain: &mrs-domain {type: http, interval: 86400, behavior: domain, format: mrs}
  yaml-domain: &yaml-domain {type: http, interval: 86400, behavior: domain, format: yaml}
  yaml-classical: &yaml-classical {type: http, interval: 86400, behavior: classical, format: yaml}

rule-providers:
  lan:
    <<: *mrs-domain
    url: "https://gh-proxy.com/https://github.com/levi882/OpenClash_SmartDNS_BTPT_Rules/raw/main/rule_converted_mrs/Lan_fake_ip_filter.mrs"

  openclash_default:
    <<: *mrs-domain
    url: "https://gh-proxy.com/https://github.com/levi882/OpenClash_SmartDNS_BTPT_Rules/raw/main/rule_converted_mrs/OpenClash_Default_fake_ip_filter.mrs"

  private_direct:
    <<: *yaml-domain
    url: "https://raw.githubusercontent.com/2263075977/daili/main/mihomo/direct.yaml"

  private_proxy:
    <<: *yaml-domain
    url: "https://raw.githubusercontent.com/2263075977/daili/main/mihomo/proxy.yaml"

  custom_port_direct:
    <<: *yaml-classical
    url: "https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Port_Direct.yaml"
