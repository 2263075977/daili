proxy-providers:
  zj:
    url: ""
    proxy: DIRECT
    type: http
    interval: 86400
    health-check: {enable: true,url: "https://cp.cloudflare.com/generate_204",interval: 300}

mixed-port: 7890
bind-address: "*"
allow-lan: true
mode: rule
log-level: warning
ipv6: true

keep-alive-idle: 600
keep-alive-interval: 15
disable-keep-alive: false

find-process-mode: off

external-ui: ui
external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist-cdn-fonts.zip
external-controller: '[::]:9090'
secret: "821259"

profile:
  store-selected: true
  store-fake-ip: true

unified-delay: true
tcp-concurrent: true

geodata-mode: true
geodata-loader: standard
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geosite: "https://testingcf.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/geosite.dat"
  geoip: "https://testingcf.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/geoip.dat"
  
dns:
  enable: true
  cache-algorithm: arc
  prefer-h3: false
  use-hosts: true
  use-system-hosts: true
  respect-rules: false
  listen: '[::]:1053'
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: fdfe:dcba:9876::1/64
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - rule-set:lan
    - rule-set:openclash_default
    - rule-set:private_direct
    - geosite:private
    - geosite:cloudflare
    - geosite:synology
    - geosite:stripe
    - geosite:google-cn
    - geosite:category-games@cn
    - geosite:category-game-platforms-download
    - geosite:category-public-tracker
    - geosite:cn
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://223.6.6.6/dns-query
  direct-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver-policy:
    "rule-set:lan,openclash_default,private_direct":
      - 223.5.5.5
      - 119.29.29.29
    "geosite:private,cloudflare,synology,stripe,google-cn,category-games@cn,category-game-platforms-download,category-public-tracker,cn":
      - 223.5.5.5
      - 119.29.29.29
  nameserver:
    - https://dns.google/dns-query#🇺🇸 美国节点
    - https://cloudflare-dns.com/dns-query#🇺🇸 美国节点

# 嗅探域名 可选配置
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff: 
    QUIC:
      ports: [443, 8443]
    TLS:
      ports: [443, 8443]
    HTTP: 
      ports: [80, 8080-8880]
      override-destination: true
  # 强制对这些域名进行嗅探（即使已经有目标地址）
  force-domain:
    - "+.netflix.com"  # Netflix 主域名
    - "+.nflxvideo.net"  # Netflix CDN
    - "+.amazonaws.com"  # AWS 云服务
    - "+.media.dssott.com"  # Disney+ 流媒体
  # 跳过对这些域名的嗅探（避免干扰）
  skip-domain:
    - "+.apple.com"  # 苹果服务
    - "Mijia Cloud"  # 米家云服务
    - "dlg.io.mi.com"  # 小米设备通信
    - "+.oray.com"  # 花生壳服务
    - "+.sunlogin.net"  # 向日葵远程控制
    - "+.push.apple.com"  # 苹果推送服务

tun:
  enable: true
  stack: mixed
  device: mihomo
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
    - tcp://any:53

proxies:
  - name: "🌐 全球直连"
    type: direct
    udp: true

FallBack: &FallBack
  type: fallback
  url: 'https://cp.cloudflare.com/generate_204'
  interval: 300
  lazy: true
  timeout: 5000
  max-failed-times: 3
UrlTest: &UrlTest
  type: url-test
  url: 'https://cp.cloudflare.com/generate_204'
  interval: 300
  lazy: true
  tolerance: 50
  timeout: 5000
  max-failed-times: 3
LoadBalance: &LoadBalance
  type: load-balance
  url: 'https://cp.cloudflare.com/generate_204'
  interval: 300
  lazy: true
  include-all: true
  strategy: sticky-sessions
  timeout: 5000
  max-failed-times: 3
    
