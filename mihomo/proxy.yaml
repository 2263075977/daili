  # PT：u2.dmhy.org 是 category-pt 里 dmhy.org 的子域，custom_cn 会先抢走并给污染 IP
  #     （31.13.73.9 / 59.24.3.173），必须放在这里走 fake-ip + 代理
  - '+.u2.dmhy.org'

  # 现网漏网复核（2026-11-02）：已测服务代理更合适，按确认范围扩展根域及全部子域
  # agentrouter.org 保持原范围；air-outer.com / oplist.org 不再仅匹配 ps / api
  - '+.agentrouter.org'
  - '+.air-outer.com'
  - '+.oplist.org'

  # 现网漏网复核（2026-11-05）：直连失败或明显更差（各 5~10 次）
  # CF 双 A 记录之一 100% 超时：tracker.anibt.net 104.21.36.142 0/7、www.pttime.fun 104.21.79.76 0/7、
  # whatshub.top 104.21.71.123 0/7 —— 给直连会随解析结果时通时断
  - 'tracker.anibt.net'
  - 'www.pttime.fun'
  - 'whatshub.top'
  # 直连超时（各 0/5）
  - 'alerts.home-assistant.io'
  - 'www.hwinfo.com'
  - 'www.wagnardsoft.com'
  - 'forums.guru3d.com'
  - 'static.addtoany.com'
  - 'i.postimg.cc'
  - 'zpsbkj.stripocdn.email'
  # 直连可达但慢 3 倍（1.5~2.2s vs 0.5~0.8s）
  - 'lsky.useforall.com'
  # updates.logitech.com：直连 8/10 可达但 TLS 0.64~6.4s 抖动（301 -> support.logi.com）
  - 'updates.logitech.com'
  # 订阅（维持现状；显式化，避免兜底组被切走后自举链路断）
  - 'sub.us.ci'
  - 'sub.pjq.cc.cd'
  - 'zrf.zrf.me'

  # 漏网复核第二批（2026-11-07）：成人 / 盗版 CDN，按既定策略显式留代理
  # （直连其实更快，但策略优先；见 diag 记录）
  # surrit.com / saawsedge.com / growcdnssedge.com 都是 MissAV 的 HLS 边缘
  # （surrit 需 missav Referer；saawsedge 证书 *.saawsedge.com 且 urlscan 抓到 edge-hls 的 m3u8；
  #  growcdnssedge 证书 CN=*.rsc.cdn77.org，Wayback 有 video.growcdnssedge.com）
  # cloudwindow-route.com 是 CDN77-Turbo 的 UGC CDN，与 missav 会话同期出现，归属未证实，按保守处理
  - '+.surrit.com'
  - '+.saawsedge.com'
  - '+.growcdnssedge.com'
  - '+.cloudwindow-route.com'

  # 直连改代理（2026-11-11）：Pixiv 图床的第三方反代（Cloudflare 前置，x-proxied-by: Pixiv.CatDE）
  # 两条原在 direct.yaml 的 freshrss 段。实测直连 IPv6 黑洞：AAAA 2606:4700:3035::ac43:da60
  # 10s 硬超时、2606:4700:3031::ac43:8796 12s 硬超时；IPv4 虽通但 TTFB 2.27s / 2.15~2.73s，
  # 浏览器优先 AAAA 时会先卡死再回落。节点侧同一 URL：i.pximg.org 香港 137ms / 自建 229ms，
  # i.pixiv.re 香港 1381ms / 自建 1402ms（mihomo group delay，单次采样，仅代表首字节）。
  # 注意：必须同时从 direct.yaml 删除。private_direct 在规则第 0 条，且被列入 dns.fake-ip-filter，
  # 只加这里仍会拿真实 IP 直连，不生效。
  - 'i.pximg.org'
  - 'i.pixiv.re'
